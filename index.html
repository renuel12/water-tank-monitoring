<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Smart Water Monitoring</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #eef3f8;
    color: #17365d;
    min-height: 100vh;
}

.phone {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    margin: auto;
    background: #f7f9fc;
    overflow: hidden;
    position: relative;
}

.header {
    height: 145px;
    background: linear-gradient(145deg, #1746c7, #1237a8);
    color: white;
    padding: 22px 20px 15px;
    text-align: center;
    border-radius: 0 0 26px 26px;
    position: relative;
}

.header .bell {
    position: absolute;
    right: 20px;
    top: 48px;
    font-size: 21px;
}

.header h1 {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .5px;
    margin-top: 25px;
}

.header p {
    font-size: 11px;
    opacity: .72;
    margin-top: 8px;
}

.content {
    padding: 18px 15px 110px;
}

.water-card,
.status-card {
    background: white;
    border-radius: 17px;
    box-shadow: 0 5px 18px rgba(27, 63, 120, .08);
}

.water-card {
    padding: 17px 13px;
}

.water-title {
    color: #1245bb;
    font-weight: 800;
    font-size: 13px;
    margin-left: 5px;
    margin-bottom: 5px;
}

.water-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 150px;
}

.level-container {
    width: 49%;
    text-align: center;
}

.circle {
    width: 122px;
    height: 122px;
    margin: auto;
    border-radius: 50%;
    position: relative;

    background:
        conic-gradient(
            #1250d5 0deg 0deg,
            #dce5ed 0deg 360deg
        );

    display: flex;
    align-items: center;
    justify-content: center;
}

.circle::before {
    content: "";
    position: absolute;
    width: 94px;
    height: 94px;
    background: white;
    border-radius: 50%;
}

.level-text {
    position: relative;
    z-index: 2;
}

.level-number {
    display: block;
    font-size: 31px;
    font-weight: 800;
    color: #111;
}

.level-label {
    display: block;
    font-size: 10px;
    color: #5d6875;
    margin-top: 3px;
}

.level-value {
    font-size: 11px;
    font-weight: 600;
    color: #444;
    margin-top: 6px;
}

.tank-container {
    width: 48%;
    display: flex;
    justify-content: center;
}

.tank {
    width: 82px;
    height: 120px;
    border: 4px solid #8ba0bd;
    border-radius: 17px 17px 13px 13px;
    position: relative;
    overflow: hidden;

    background: linear-gradient(
        to right,
        rgba(220,235,255,.5),
        rgba(255,255,255,.7)
    );
}

.tank-water {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;

    background: linear-gradient(
        180deg,
        #1ca9ed,
        #007ee5
    );

    opacity: .9;
    transition: height .4s ease;
}

.tank-water::before {
    content: "";
    position: absolute;
    top: -4px;
    left: -5%;
    width: 110%;
    height: 9px;
    border-radius: 50%;
    background: #18a9ed;
}

.tank-base {
    position: absolute;
    width: 100px;
    height: 8px;
    bottom: -16px;
    left: -13px;
    background: #273442;
    transform: skew(-12deg);
}

.tank-stand {
    position: absolute;
    width: 7px;
    height: 23px;
    background: #273442;
    bottom: -19px;
    left: 9px;
}

.tank-stand.right {
    left: 65px;
}

.status-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 13px;
}

.status-card {
    min-height: 92px;
    padding: 12px;
    border-radius: 13px;
}

.status-title {
    font-size: 9px;
    font-weight: 800;
    color: #1250c5;
    text-align: center;
    margin-bottom: 8px;
}

.status-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.status-icon {
    font-size: 29px;
}

.status-text {
    font-size: 15px;
    font-weight: 700;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
}

.green {
    background: #35bd6b;
}

.red {
    background: #ed5360;
}

.yellow {
    background: #f2b705;
}

.status-small {
    font-size: 9px;
    color: #555;
}

.control-title {
    text-align: center;
    color: #1450c4;
    font-size: 11px;
    font-weight: 800;
    margin: 15px 0 9px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
}

button {
    border: none;
    height: 42px;
    border-radius: 9px;
    color: white;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
}

.pump-on {
    background: #22ad5b;
}

.pump-off {
    background: #ed4c56;
}

.pump-auto {
    background: #2867d8;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.command-status {
    text-align: center;
    font-size: 10px;
    color: #667;
    margin-top: 8px;
    min-height: 15px;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 390px;
    height: 74px;
    background: white;
    border-top: 1px solid #e7eaf0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-items: center;
    z-index: 10;
}

.nav-item {
    text-align: center;
    font-size: 9px;
    color: #8a94a2;
}

.nav-item.active {
    color: #1260d8;
    font-weight: 700;
}

.nav-icon {
    font-size: 21px;
    display: block;
    margin-bottom: 3px;
}

</style>

</head>

<body>

<div class="phone">

<header class="header">

<div class="bell">♧</div>

<h1>
SMART WATER<br>
MONITORING
</h1>

<p>
Real-Time Water Tank Monitoring
</p>

</header>

<main class="content">

<section class="water-card">

<div class="water-title">
WATER LEVEL
</div>

<div class="water-main">

<div class="level-container">

<div class="circle" id="levelCircle">

<div class="level-text">

<span class="level-number" id="levelNumber">
0%
</span>

<span class="level-label">
Water Level
</span>

</div>

</div>

<div class="level-value" id="distanceValue">
0.0 cm
</div>

</div>

<div class="tank-container">

<div class="tank">

<div class="tank-water" id="tankWater"></div>

<div class="tank-stand"></div>

<div class="tank-stand right"></div>

<div class="tank-base"></div>

</div>

</div>

</div>

</section>

<div class="status-grid">

<div class="status-card">

<div class="status-title">
TANK STATUS
</div>

<div class="status-content">

<div class="status-icon">
💧
</div>

<div>

<div class="status-text" id="tankStatus">
<span class="status-dot red"></span>
LOW
</div>

<div class="status-small" id="tankStatusSmall">
Waiting for data
</div>

</div>

</div>

</div>

<div class="status-card">

<div class="status-title">
PUMP STATUS
</div>

<div class="status-content">

<div class="status-icon">
⚙️
</div>

<div>

<div class="status-text" id="pumpStatus">
<span class="status-dot red"></span>
OFF
</div>

<div class="status-small" id="pumpStatusSmall">
Stopped
</div>

</div>

</div>

</div>

<div class="status-card">

<div class="status-title">
LED STATUS
</div>

<div class="status-content">

<div class="status-icon">
💡
</div>

<div>

<div class="status-text" id="ledStatus">
<span class="status-dot red"></span>
OFF
</div>

<div class="status-small" id="ledStatusSmall">
Inactive
</div>

</div>

</div>

</div>

<div class="status-card">

<div class="status-title">
BUZZER STATUS
</div>

<div class="status-content">

<div class="status-icon">
🔔
</div>

<div>

<div class="status-text" id="buzzerStatus">
<span class="status-dot red"></span>
OFF
</div>

<div class="status-small" id="buzzerStatusSmall">
Inactive
</div>

</div>

</div>

</div>

</div>

<div class="control-title">
PUMP CONTROL
</div>

<div class="buttons">

<button
class="pump-on"
id="pumpOnButton"
onclick="pumpOn()">
⏻ PUMP ON </button>

<button
class="pump-off"
id="pumpOffButton"
onclick="pumpOff()">
⏻ PUMP OFF </button>

<button
class="pump-auto"
id="pumpAutoButton"
onclick="pumpAuto()">
AUTO </button>

</div>

<div
class="command-status"
id="commandStatus">
Firebase connecting...
</div>

</main>

<nav class="bottom-nav">

<div class="nav-item active">

<span class="nav-icon">
⌂
</span>

Dashboard

</div>

<div class="nav-item">

<span class="nav-icon">
↶
</span>

History

</div>

<div class="nav-item">

<span class="nav-icon">
◯
</span>

Control

</div>

<div class="nav-item">

<span class="nav-icon">
⚙
</span>

Settings

</div>

</nav>

</div>

<script type="module">

/************************************************
 * FIREBASE
 ************************************************/

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/************************************************
 * FIREBASE CONFIG
 ************************************************/

const firebaseConfig = {

    apiKey:
        "AIzaSyBu2sB-qRxXvGA1Te_qynrKGj1KX-UDUaQ",

    authDomain:
        "water-tank-monitoring-a4be2.firebaseapp.com",

    databaseURL:
        "https://water-tank-monitoring-a4be2-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "water-tank-monitoring-a4be2",

    storageBucket:
        "water-tank-monitoring-a4be2.firebasestorage.app",

    messagingSenderId:
        "112963802987",

    appId:
        "1:112963802987:web:3d905732bc372fae22de2e",

    measurementId:
        "G-BV6BNXD4FF"
};


/************************************************
 * INITIALIZE
 ************************************************/

const app = initializeApp(firebaseConfig);

const database = getDatabase(app);


/************************************************
 * REFERENCES
 ************************************************/

const waterTankRef =
    ref(database, "waterTank");

const commandRef =
    ref(database, "waterTank/pumpCommand");


/************************************************
 * FIREBASE REAL-TIME LISTENER
 ************************************************/

onValue(
    waterTankRef,

    (snapshot) => {

        const data = snapshot.val();

        console.log("Firebase data:", data);

        if (!data) {

            document.getElementById(
                "commandStatus"
            ).textContent =
                "No Firebase data";

            return;
        }


        const percentage =
            Math.max(
                0,
                Math.min(
                    100,
                    Number(data.percentage || 0)
                )
            );


        const distance =
            Number(data.distance || 0);


        const status =
            String(
                data.status || "LOW"
            ).toUpperCase();


        const pump =
            String(
                data.pump || "OFF"
            ).toUpperCase();


        const command =
            String(
                data.pumpCommand || "AUTO"
            ).toUpperCase();


        /****************************************
         * WATER LEVEL
         ****************************************/

        document.getElementById(
            "levelNumber"
        ).textContent =
            percentage + "%";


        document.getElementById(
            "distanceValue"
        ).textContent =
            distance.toFixed(1) + " cm";


        /****************************************
         * CIRCLE
         ****************************************/

        const degrees =
            percentage * 3.6;

        document.getElementById(
            "levelCircle"
        ).style.background =
            `conic-gradient(
                #1250d5 0deg ${degrees}deg,
                #dce5ed ${degrees}deg 360deg
            )`;


        /****************************************
         * TANK
         ****************************************/

        document.getElementById(
            "tankWater"
        ).style.height =
            percentage + "%";


        /****************************************
         * TANK STATUS
         ****************************************/

        const tankStatus =
            document.getElementById(
                "tankStatus"
            );

        const tankStatusSmall =
            document.getElementById(
                "tankStatusSmall"
            );


        if (status === "FULL") {

            tankStatus.innerHTML =
                '<span class="status-dot green"></span> FULL';

            tankStatusSmall.textContent =
                "Tank is full";

        }

        else if (status === "MEDIUM") {

            tankStatus.innerHTML =
                '<span class="status-dot yellow"></span> MEDIUM';

            tankStatusSmall.textContent =
                "Normal";

        }

        else {

            tankStatus.innerHTML =
                '<span class="status-dot red"></span> LOW';

            tankStatusSmall.textContent =
                "Low water level";
        }


        /****************************************
         * ACTUAL PUMP
         ****************************************/

        const pumpStatus =
            document.getElementById(
                "pumpStatus"
            );

        const pumpStatusSmall =
            document.getElementById(
                "pumpStatusSmall"
            );


        if (pump === "ON") {

            pumpStatus.innerHTML =
                '<span class="status-dot green"></span> ON';

            pumpStatusSmall.textContent =
                "Running";

        }

        else {

            pumpStatus.innerHTML =
                '<span class="status-dot red"></span> OFF';

            pumpStatusSmall.textContent =
                "Stopped";
        }


        /****************************************
         * LED
         ****************************************/

        const ledStatus =
            document.getElementById(
                "ledStatus"
            );

        const ledStatusSmall =
            document.getElementById(
                "ledStatusSmall"
            );


        if (status === "LOW") {

            ledStatus.innerHTML =
                '<span class="status-dot red"></span> ON';

            ledStatusSmall.textContent =
                "LOW indicator";

        }

        else if (status === "MEDIUM") {

            ledStatus.innerHTML =
                '<span class="status-dot yellow"></span> ON';

            ledStatusSmall.textContent =
                "MEDIUM indicator";

        }

        else {

            ledStatus.innerHTML =
                '<span class="status-dot green"></span> ON';

            ledStatusSmall.textContent =
                "FULL indicator";
        }


        /****************************************
         * BUZZER
         ****************************************/

        const buzzerStatus =
            document.getElementById(
                "buzzerStatus"
            );

        const buzzerStatusSmall =
            document.getElementById(
                "buzzerStatusSmall"
            );


        if (status === "LOW") {

            buzzerStatus.innerHTML =
                '<span class="status-dot green"></span> ON';

            buzzerStatusSmall.textContent =
                "Low-level warning";

        }

        else {

            buzzerStatus.innerHTML =
                '<span class="status-dot red"></span> OFF';

            buzzerStatusSmall.textContent =
                "Inactive";
        }


        /****************************************
         * MODE
         ****************************************/

        document.getElementById(
            "commandStatus"
        ).textContent =
            "Current mode: " + command;


        /****************************************
         * BUTTONS
         ****************************************/

        updateButtons(command);

    },

    (error) => {

        console.error(
            "Firebase error:",
            error
        );

        document.getElementById(
            "commandStatus"
        ).textContent =
            "Firebase error: " + error.message;
    }
);


/************************************************
 * BUTTON STATE
 ************************************************/

function updateButtons(command) {

    document.getElementById(
        "pumpOnButton"
    ).disabled =
        command === "ON";


    document.getElementById(
        "pumpOffButton"
    ).disabled =
        command === "OFF";


    document.getElementById(
        "pumpAutoButton"
    ).disabled =
        command === "AUTO";
}


/************************************************
 * SEND COMMAND
 ************************************************/

async function sendPumpCommand(command) {

    console.log(
        "Sending command:",
        command
    );


    const status =
        document.getElementById(
            "commandStatus"
        );


    status.textContent =
        "Sending " + command + "...";


    try {

        await set(
            commandRef,
            command
        );


        console.log(
            "Command successfully written:",
            command
        );


        status.textContent =
            "Command sent: " + command;


    }

    catch (error) {

        console.error(
            "WRITE ERROR:",
            error
        );


        status.textContent =
            "Firebase write error";


        alert(
            "Firebase error:\n\n" +
            error.message
        );
    }
}


/************************************************
 * PUMP ON
 ************************************************/

window.pumpOn = function() {

    console.log("PUMP ON clicked");

    sendPumpCommand("ON");

};


/************************************************
 * PUMP OFF
 ************************************************/

window.pumpOff = function() {

    console.log("PUMP OFF clicked");

    sendPumpCommand("OFF");

};


/************************************************
 * AUTO
 ************************************************/

window.pumpAuto = function() {

    console.log("AUTO clicked");

    sendPumpCommand("AUTO");

};


console.log(
    "SMART WATER MONITORING WEBSITE READY"
);

</script>

</body>
</html>
